<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Event Scheduler Widget</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>

  <!-- Color Scheme Selector -->
  <div id="color-scheme-selector">
    <button id="color-scheme-btn">Color Styles</button>
    <div id="color-dropdown" class="hidden">
      <button class="color-option" data-color="current">Default</button>
      <button class="color-option" data-color="black">Black</button>
      <button class="color-option" data-color="white">White</button>
    </div>
  </div>

<div id="scheduler-widget">
  <h2 class="heading">Add New Event</h2>
  
  <div class="inline-group">
    <div>
      <label for="event-title">Event Title</label>
      <input type="text" id="event-title" placeholder="Enter event title" />
    </div>
    <div>
      <label for="event-date">Event Date</label>
      <input type="date" id="event-date" placeholder="Select event date" />
    </div>
  </div>
  
  <div class="inline-group">
    <div>
      <label for="start-time">Start Time</label>
      <input type="time" id="start-time" />
    </div>
    <div>
      <label for="end-time">End Time</label>
      <input type="time" id="end-time" />
    </div>
  </div>

  <div class="full-line">
    <label for="event-description">Event Description</label>
    <input type="text" id="event-description" placeholder="Enter event description" />
  </div>

  <button id="save-btn">Save Event</button>

  <p id="status-msg"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="script.js"></script>
<script src="animations.js"></script>
</body>
</html>
